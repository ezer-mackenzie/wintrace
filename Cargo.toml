[package]
name = "wintrace"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "Windows Event Log querying and EVTX parsing for Python, powered by Rust and PyO3"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ezer-mackenzie/wintrace"

[lib]
name = "_wintrace"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.0" }
pythonize = "0.29.0"
roxmltree = "0.21.1"
serde_json = "1.0"
evtx = { version = "0.12.3", default-features = false, features = ["multithreading"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_EventLog"]
